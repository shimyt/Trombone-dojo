<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="15分道場">
<meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>トロンボーン15分道場</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Rajdhani:wght@500;600;700&display=swap">
<style>
/* Layout: arcade console. Home = stage map with cheer buddy; stage = score sheet on a lit stage + live meter + buddy reactions. Dark, committed. */
:root {
  --bg: #0c0f17; --panel: #151a26; --panel2: #1e2535; --line: #2a3346; --staff: #5b6680;
  --fg: #eef1f7; --mute: #8e98ad; --accent: #ffb020; --accent2: #35d6c8;
  --good: #4ade80; --warn: #fbbf24; --bad: #f87171; --perfect: #ffd54a; --boss: #8b5cf6;
  --display: "Rajdhani", "Zen Kaku Gothic New", system-ui, sans-serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: radial-gradient(1200px 600px at 50% -200px, #1b2340 0%, var(--bg) 60%) fixed, var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px; }
* { box-sizing: border-box; }
button { font-family: inherit; font-size: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent2); outline-offset: 2px; }
.app { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; padding: 10px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
.brand { font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: .04em; } .brand span { color: var(--accent); }
.stat { display: flex; align-items: baseline; gap: 6px; font-variant-numeric: tabular-nums; }
.stat .k, .sc .k { font-size: 11px; color: var(--mute); letter-spacing: .1em; }
.stat .v { font-family: var(--display); font-weight: 700; font-size: 20px; }
.xpbar { flex: 1 1 140px; height: 8px; background: var(--panel2); border-radius: 4px; overflow: hidden; min-width: 100px; }
.xpbar > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent2), var(--accent)); transition: width .5s; }
.mic { font-size: 12px; color: var(--mute); display: flex; align-items: center; gap: 6px; }
.mic b { width: 8px; height: 8px; border-radius: 50%; background: var(--bad); display: inline-block; }
.mic.on b { background: var(--good); box-shadow: 0 0 8px var(--good); }
.stage { display: flex; flex-direction: column; gap: 14px; }
.quote { padding: 12px 16px; border-left: 3px solid var(--accent); background: var(--panel); border-radius: 0 12px 12px 0; }
.quote .who { font-size: 11px; color: var(--mute); letter-spacing: .08em; }
.quote .q { font-weight: 700; font-size: 16px; } .quote .qe { color: var(--mute); font-size: 13px; }
/* buddy */
.buddy { display: flex; align-items: flex-end; gap: 10px; }
.buddy svg { width: 76px; height: 76px; flex: none; animation: bob 2.4s ease-in-out infinite; }
.buddy.jump svg { animation: jump .55s ease-out, bob 2.4s ease-in-out .55s infinite; }
.buddy.sad svg { animation: shake .4s; }
.bubble { position: relative; background: var(--panel2); border: 1px solid var(--line); border-radius: 16px 16px 16px 4px; padding: 9px 14px; font-weight: 700; font-size: 15px; min-width: 0; margin-bottom: 14px; }
@keyframes bob { 50% { transform: translateY(-4px); } }
@keyframes jump { 30% { transform: translateY(-18px) rotate(-6deg); } 60% { transform: translateY(0) scale(1.08, .92); } }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
/* map */
.map { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; justify-content: center; padding: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
.map .link { width: 22px; height: 3px; background: var(--line); border-radius: 2px; }
.node { background: none; border: 0; color: var(--fg); display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px; border-radius: 12px; min-width: 96px; }
.node:hover { background: var(--panel2); }
.node .orb { width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 24px; background: var(--panel2); border: 3px solid var(--line); transition: transform .15s; }
.node:hover .orb { transform: scale(1.08); }
.node.done .orb { border-color: var(--good); box-shadow: 0 0 14px rgba(74,222,128,.35); }
.node.boss .orb { border-color: var(--boss); background: #241640; box-shadow: 0 0 18px rgba(139,92,246,.45); }
.node.boss.done .orb { border-color: var(--perfect); }
.node .nm { font-family: var(--display); font-size: 11px; letter-spacing: .12em; color: var(--mute); }
.node.boss .nm { color: var(--boss); }
.node .nn { font-weight: 700; font-size: 14px; }
.node .st { font-size: 12px; color: var(--perfect); letter-spacing: .1em; min-height: 1.4em; }
.btn { background: var(--accent); color: #1a1200; border: 0; border-radius: 12px; padding: 12px 20px; font-weight: 900; font-size: 16px; box-shadow: 0 4px 0 #a86f00; transition: transform .08s, box-shadow .08s; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #a86f00; }
.btn.big { font-size: 19px; padding: 14px 30px; }
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); box-shadow: none; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.settings { display: flex; gap: 8px 14px; flex-wrap: wrap; align-items: center; color: var(--mute); font-size: 13px; }
.settings input[type=number] { width: 64px; background: var(--panel2); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; }
.hist { display: flex; gap: 3px; align-items: flex-end; height: 56px; width: 180px; } .hist i { flex: 1; background: var(--panel2); border-radius: 3px 3px 0 0; } .hist i.on { background: var(--accent2); }
.histl { font-size: 11px; color: var(--mute); text-align: right; }
/* stage */
.stagehead { display: flex; align-items: center; gap: 10px 16px; flex-wrap: wrap; }
.stagehead h2 { margin: 0; font-size: 21px; flex: 1 1 auto; }
.tag { font-family: var(--display); font-size: 13px; letter-spacing: .12em; padding: 2px 8px; border-radius: 6px; background: var(--panel2); color: var(--accent2); vertical-align: middle; }
.tag.boss { background: #241640; color: var(--boss); }
.sc b { font-family: var(--display); font-size: 24px; font-variant-numeric: tabular-nums; color: var(--accent); }
.time { font-family: var(--display); font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
.arena { position: relative; background: linear-gradient(180deg, #171d2c, var(--panel)); border: 1px solid var(--line); border-radius: 16px; padding: 18px; min-height: 320px; overflow: hidden; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.arena.intro { gap: 14px; }
.arena canvas.fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
.arena.fever { animation: fever .5s ease-in-out infinite alternate; border-color: var(--accent); }
@keyframes fever { from { box-shadow: 0 0 0 1px var(--accent), 0 0 18px rgba(255,176,32,.35) inset; } to { box-shadow: 0 0 0 2px var(--perfect), 0 0 40px rgba(255,213,74,.5) inset; } }
.arena.shake { animation: shake .3s; }
.plist { display: flex; flex-direction: column; gap: 8px; width: 100%; }
.pv { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; overflow-x: auto; }
.pv .pt, .ptitle { font-weight: 700; font-size: 14px; color: var(--accent2); }
.ptitle { font-size: 17px; }
.staffwrap { width: 100%; overflow-x: auto; display: flex; justify-content: center; background: var(--bg); border-radius: 12px; padding: 4px 8px; }
.staffsvg { width: 100%; height: auto; display: block; }
.staffsvg ellipse.pop { animation: pop .35s ease-out; transform-box: fill-box; transform-origin: center; }
@keyframes pop { 40% { transform: scale(1.7); } }
.phase { font-family: var(--display); font-weight: 700; font-size: 30px; letter-spacing: .08em; min-height: 1.3em; color: var(--mute); }
.phase.ref { color: var(--accent2); } .phase.play { color: var(--perfect); } .phase.count { color: var(--warn); font-size: 44px; animation: pop .3s; } .phase.count.go { color: var(--perfect); }
.meter { width: 100%; max-width: 520px; }
.meter .scale { position: relative; height: 50px; }
.meter .zone { position: absolute; top: 16px; height: 18px; border-radius: 4px; background: var(--panel2); left: 0; right: 0; }
.meter .zone i { position: absolute; top: 0; bottom: 0; border-radius: 4px; }
.meter .zone .ok { left: 5%; right: 5%; background: rgba(251,191,36,.14); } .meter .zone .great { left: 25%; right: 25%; background: rgba(74,222,128,.22); } .meter .zone .perfect { left: 40%; right: 40%; background: rgba(255,213,74,.45); }
.meter .needle { position: absolute; top: 4px; width: 4px; height: 42px; margin-left: -2px; background: var(--fg); border-radius: 2px; left: 50%; transition: left .06s linear; box-shadow: 0 0 10px rgba(255,255,255,.4); }
.meter .needle.off { opacity: .2; }
.meter .lbl { display: flex; justify-content: space-between; font-family: var(--display); font-size: 12px; color: var(--mute); }
.readout { display: flex; gap: 8px 22px; font-family: var(--display); font-variant-numeric: tabular-nums; font-size: 15px; color: var(--mute); flex-wrap: wrap; justify-content: center; }
.readout b { color: var(--fg); font-size: 20px; }
.judge { position: absolute; top: 12px; right: 16px; z-index: 6; text-align: right; opacity: 0; transform: translateY(8px) scale(.85); transition: opacity .12s, transform .12s; text-shadow: 0 2px 14px rgba(0,0,0,.7); }
.judge b { display: block; font-size: 38px; font-weight: 900; line-height: 1.1; } .judge small { font-family: var(--display); font-size: 14px; letter-spacing: .1em; }
.judge.show { opacity: 1; transform: none; }
.judge.P { color: var(--perfect); } .judge.G { color: var(--good); } .judge.O { color: var(--warn); } .judge.M { color: var(--bad); }
.combo { position: absolute; top: 12px; left: 16px; z-index: 6; font-family: var(--display); font-weight: 700; font-size: 34px; color: var(--accent2); line-height: 1; }
.combo small { display: block; font-size: 12px; color: var(--mute); letter-spacing: .15em; }
.hint { color: var(--mute); font-size: 13px; text-align: center; max-width: 560px; } .hint.big { font-size: 15px; color: var(--fg); }
/* breath */
.breath { width: 210px; height: 210px; border-radius: 50%; background: radial-gradient(circle, var(--accent2) 0%, rgba(53,214,200,.15) 60%, transparent 70%); transform: scale(.5); transition: transform 1s linear; display: flex; align-items: center; justify-content: center; font-family: var(--body); font-size: 22px; font-weight: 900; color: #04201d; text-align: center; }
.breath.push { background: radial-gradient(circle, var(--accent) 0%, rgba(255,176,32,.2) 60%, transparent 70%); }
.pressure { width: 100%; max-width: 420px; height: 10px; background: var(--panel2); border-radius: 5px; overflow: hidden; } .pressure i { display: block; height: 100%; width: 0; background: var(--accent2); transition: width .1s; }
.lesson { text-align: center; font-weight: 700; font-size: 16px; max-width: 560px; min-height: 3.2em; } .lesson span { display: block; font-weight: 400; font-size: 13px; color: var(--mute); }
/* boss */
.bossbox { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; max-width: 560px; }
.bossimg { width: 70px; height: 62px; flex: none; animation: bob 1.6s ease-in-out infinite; } .bossimg.hurt { animation: hurt .35s; }
@keyframes hurt { 30% { transform: translateX(8px) rotate(8deg); filter: brightness(2.2); } }
.hpwrap { flex: 1; } .hpname { font-family: var(--display); font-size: 12px; letter-spacing: .15em; color: var(--boss); }
.hp { height: 14px; background: var(--panel2); border-radius: 7px; overflow: hidden; border: 1px solid #3b2a66; } .hp i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #ef4444, #f97316); transition: width .3s; }
.dmg { position: absolute; left: 60px; top: -6px; font-family: var(--display); font-weight: 700; color: var(--perfect); font-size: 20px; animation: up .9s ease-out forwards; }
@keyframes up { to { transform: translateY(-30px); opacity: 0; } }
.scope { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; width: 100%; }
.sp { background: var(--panel2); border: 2px solid var(--line); border-radius: 10px; padding: 6px; display: flex; flex-direction: column; gap: 4px; min-width: 0; transition: border-color .15s; }
.sp.live { border-color: var(--perfect); box-shadow: 0 0 14px rgba(255,213,74,.3); }
.sp canvas { width: 100%; height: auto; border-radius: 6px; display: block; }
.spn { font-family: var(--display); font-size: 12px; letter-spacing: .12em; color: var(--mute); }
.chk { display: flex; flex-direction: column; gap: 2px; font-size: 12px; font-variant-numeric: tabular-nums; }
.chk span { padding: 1px 6px; border-radius: 4px; background: var(--bg); }
.chk span::before { margin-right: 4px; } .chk .l0::before { content: '◎'; } .chk .l1::before { content: '○'; } .chk .l2::before { content: '△'; } .chk .l3::before { content: '×'; }
.chk .l0 { color: var(--perfect); } .chk .l1 { color: var(--good); } .chk .l2 { color: var(--warn); } .chk .l3 { color: var(--bad); }
.why { width: 100%; background: var(--bg); border-radius: 10px; padding: 10px 14px; font-size: 14px; min-height: 3em; } .why b { color: var(--accent2); }
@media (max-width: 620px) { .scope { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.report { gap: 12px; }
.rhead { font-family: var(--display); letter-spacing: .2em; color: var(--mute); font-size: 14px; } .rhead span { margin-left: 8px; }
.total { position: relative; z-index: 6; font-family: var(--display); font-weight: 700; font-size: 92px; line-height: 1; font-variant-numeric: tabular-nums; color: var(--fg); text-shadow: 0 0 24px rgba(53,214,200,.35); }
.total small { font-size: 28px; margin-left: 4px; color: var(--mute); }
.total.reveal { color: var(--perfect); animation: stamp .45s cubic-bezier(.2,1.6,.4,1); text-shadow: 0 0 40px rgba(255,213,74,.6); }
.diff { min-height: 1.6em; font-family: var(--display); font-size: 20px; font-weight: 700; } .diff .up { color: var(--good); } .diff .down { color: var(--bad); }
.rgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 14px; width: 100%; align-items: start; }
.rcol { min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.radarsvg { width: 100%; max-width: 360px; margin: 0 auto; display: block; } .radar { animation: grow 1s ease-out 2.3s both; transform-origin: 150px 140px; }
@keyframes grow { from { transform: scale(0); opacity: 0; } }
.legend { font-size: 12px; color: var(--mute); text-align: center; } .legend i { display: inline-block; width: 18px; height: 3px; margin: 0 4px 3px 8px; vertical-align: middle; } .legend .l1 { background: var(--accent2); } .legend .l2 { border-top: 2px dashed var(--mute); }
.wt { font-weight: 900; color: var(--accent); letter-spacing: .05em; }
.weak { display: flex; gap: 10px; align-items: flex-start; background: var(--panel2); border-radius: 10px; padding: 10px 12px; animation: slidein .5s ease-out both; }
.weak b { font-family: var(--display); font-size: 28px; line-height: 1; color: var(--bad); flex: none; width: 22px; text-align: center; }
.weak:nth-of-type(2) b { color: var(--bad); } .wtitle { font-weight: 700; } .wtip { font-size: 13px; color: var(--mute); }
.bestline { font-size: 14px; animation: slidein .5s ease-out both; } .bestline b { color: var(--good); }
@keyframes slidein { from { transform: translateX(30px); opacity: 0; } }
.trendsvg { width: 100%; height: auto; }
@media (max-width: 620px) { .rgrid { grid-template-columns: 1fr; } .total { font-size: 64px; } }
/* result */
.result { text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; position: relative; z-index: 6; }
.stamp { font-family: var(--display); font-size: 96px; font-weight: 700; line-height: 1; color: var(--accent); animation: stamp .5s cubic-bezier(.2,1.6,.4,1); text-shadow: 0 0 30px rgba(255,176,32,.5); }
.stamp.rS { color: var(--perfect); } .stamp.rD, .stamp.rC { color: var(--mute); text-shadow: none; }
@keyframes stamp { from { transform: scale(3) rotate(-15deg); opacity: 0; } }
.result .score { font-family: var(--display); font-size: 48px; font-weight: 700; line-height: 1; }
.xpgain { color: var(--accent2); font-weight: 700; }
.result table { border-collapse: collapse; font-variant-numeric: tabular-nums; }
.result td { padding: 3px 12px; color: var(--mute); text-align: left; } .result td:last-child { color: var(--fg); text-align: right; font-family: var(--display); font-size: 17px; }
.result td.okc { color: var(--good); } .result td.ngc { color: var(--warn); }
.levelup { font-family: var(--display); font-size: 40px; color: var(--perfect); font-weight: 700; animation: stamp .6s; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--panel2); border: 1px solid var(--line); padding: 10px 16px; border-radius: 10px; max-width: 90%; font-size: 14px; z-index: 20; }
@media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }
@media (max-width: 520px) { .judge b { font-size: 28px; } .phase.count { font-size: 36px; } .node { min-width: 80px; } .map .link { display: none; } .stamp { font-size: 72px; } }
/* v7: big feedback, per-stage visualization, tendencies */
.judge em { display: block; font-style: normal; font-size: 26px; font-weight: 900; line-height: 1.15; }
.judge small { font-size: 13px; opacity: .8; }
.coach { width: 100%; display: flex; gap: 16px; align-items: stretch; background: var(--bg); border: 2px solid var(--line); border-radius: 14px; padding: 14px 18px; min-height: 104px; position: relative; z-index: 6; }
.coach .cv { flex: none; width: 190px; display: flex; flex-direction: column; justify-content: center; gap: 2px; border-right: 1px solid var(--line); padding-right: 14px; }
.coach .cn { font-size: 13px; color: var(--mute); font-weight: 700; }
.coach .cv b { font-size: 34px; font-weight: 900; line-height: 1.1; color: var(--fg); }
.coach .cv small { font-family: var(--display); font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--fg); }
.coach .ca { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
.coach .lab, .nextcard .lab, .tend .lab { font-size: 13px; letter-spacing: .12em; color: var(--accent2); font-weight: 900; }
.coach .act { font-size: 22px; font-weight: 900; line-height: 1.4; }
.coach .sub { font-size: 15px; color: var(--mute); }
.coach.l0 { border-color: var(--perfect); } .coach.l0 .cv b { color: var(--perfect); }
.coach.l1 { border-color: var(--good); } .coach.l1 .cv b { color: var(--good); }
.coach.l2 { border-color: var(--warn); } .coach.l2 .cv b { color: var(--warn); }
.coach.l3 { border-color: var(--bad); } .coach.l3 .cv b { color: var(--bad); }
.coach.flash { animation: cflash .45s ease-out; }
@keyframes cflash { 40% { transform: scale(1.015); box-shadow: 0 0 26px rgba(255,213,74,.28); } }
.scope { grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); }
.scope.one { grid-template-columns: 1fr; }
.spn { font-size: 15px; color: var(--fg); font-weight: 700; letter-spacing: .04em; } .spn span { color: var(--accent2); }
.chk { font-size: 15px; gap: 4px; } .chk span { padding: 4px 8px; font-weight: 700; border-radius: 6px; }
.howto { width: 100%; font-size: 15px; color: var(--mute); background: var(--bg); border-radius: 10px; padding: 8px 14px; } .howto summary { cursor: pointer; color: var(--accent2); font-weight: 700; }
.bcv { width: 100%; max-width: 720px; height: auto; border-radius: 10px; display: block; }
.readout { font-size: 17px; } .readout b { font-size: 26px; }
.nextcard { width: 100%; max-width: 640px; text-align: left; background: var(--bg); border: 2px solid var(--warn); border-radius: 14px; padding: 14px 18px; }
.nextcard.l0 { border-color: var(--perfect); }
.nextcard .nt { font-size: 22px; font-weight: 900; line-height: 1.4; }
.nextcard .na { font-size: 17px; margin-top: 4px; line-height: 1.5; }
.nextcard.big { max-width: none; } .nextcard.big .nt { font-size: 26px; } .nextcard.big .na { font-size: 18px; }
.tend { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 14px 18px; display: flex; flex-direction: column; gap: 10px; animation: slidein .5s ease-out 2.4s both; }
.tend .head { font-size: 24px; font-weight: 900; line-height: 1.4; }
.tend .strong { font-size: 15px; color: var(--good); font-weight: 700; }
.tchips { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; }

  AXES.forEach((a, i) => { const [x, y] = pt(i, 100), [lx, ly] = pt(i, 122); s += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)"/><text x="${lx}" y="${ly + 4}" text-anchor="middle" font-size="13" font-weight="700" fill="var(--fg)">${a.name}</text><text x="${lx}" y="${ly + 19}" text-anchor="middle" font-size="12" fill="var(--accent)">${sc[a.k] === null ? '—' : Math.round(sc[a.k])}</text>`; });
  if (prev) s += `<polygon points="${AXES.map((a, i) => pt(i, prev[a.k] ?? 0).join(',')).join(' ')}" fill="none" stroke="var(--mute)" stroke-dasharray="4 4" stroke-width="1.5"/>`;
  s += `<polygon class="radar" points="${AXES.map((a, i) => pt(i, sc[a.k] ?? 0).join(',')).join(' ')}" fill="rgba(53,214,200,.28)" stroke="var(--accent2)" stroke-width="2.5"/>`;
  return `<svg viewBox="-20 0 340 290" class="radarsvg" role="img" aria-label="今日の項目別スコア">${s}</svg>`;
}
function trendSVG() {
  const d = new Date(); d.setDate(d.getDate() - 13); const pts = [];
  for (let i = 0; i < 14; i++) { const r = S.history[dkey(d)]; pts.push({ k: dkey(d).slice(5), v: r && r.total ? r.total : null }); d.setDate(d.getDate() + 1); }
  const W = 300, H = 90, x = i => 10 + i * (W - 20) / 13, y = v => H - 12 - (v - 40) / 60 * (H - 24);
  const have = pts.map((p, i) => [i, p.v]).filter(p => p[1] !== null);
  let s = `<line x1="10" x2="${W - 10}" y1="${y(80)}" y2="${y(80)}" stroke="var(--line)" stroke-dasharray="3 3"/><text x="${W - 10}" y="${y(80) - 3}" text-anchor="end" font-size="10" fill="var(--mute)">80点</text>`;
  if (have.length > 1) s += `<polyline points="${have.map(([i, v]) => x(i) + ',' + y(clamp(v, 40, 100))).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2"/>`;
  have.forEach(([i, v], k) => { s += `<circle cx="${x(i)}" cy="${y(clamp(v, 40, 100))}" r="${k === have.length - 1 ? 5 : 3}" fill="var(--accent)"/>`; });
  s += `<text x="10" y="${H}" font-size="10" fill="var(--mute)">${pts[0].k}</text><text x="${W - 10}" y="${H}" text-anchor="end" font-size="10" fill="var(--mute)">今日</text>`;
  return `<svg viewBox="0 0 ${W} ${H + 4}" class="trendsvg" role="img" aria-label="14日間の総合点の推移">${s}</svg>`;
}
function report() {
  stopStage(); const rec = dayRec(); const R = computeReport(rec, true), RA = computeReport(rec, false);
  let prevRec = null; { const d = new Date(); for (let k = 1; k < 30; k++) { d.setDate(d.getDate() - 1); const r = S.history[dkey(d)]; if (r && r.sc) { prevRec = r; break; } } }
  rec.total = Math.round(R.total * 1000) / 1000; rec.sc = R.sc; rec.raw = Object.fromEntries(Object.entries(R.raw).map(([k, v]) => [k, okv(v) ? Math.round(v * 10) / 10 : null])); save();
  const diff = prevRec ? R.total - prevRec.total : null;
  const comment = R.total >= 90 ? '師匠レベル！！ロングトーンからボスまで隙なし' : R.total >= 80 ? 'かなりいい！苦手1位だけ潰せば90点台' : R.total >= 70 ? 'いい練習だった！明日はカードの1つだけ' : R.total >= 50 ? '伸びしろだらけ！まずは1つだけ意識しよ' : 'やったことがえらい！明日も15分';
  const T = tendencies(RA.raw), bad = T.filter(t => t.lvl > 0).sort((a, b) => b.lvl - a.lvl), goodT = T.filter(t => t.lvl === 0);
  const headline = !T.length ? 'データがまだ少ないです。全ステージやると傾向が出ます' : bad.length ? bad.slice(0, 2).map(t => t.text).join('、') + '。' : '大きな偏りなし。今日の吹き方がそのまま基準になる';
  const strong = goodT.length ? '強み：' + goodT.slice(0, 3).map(t => t.text).join('・') : '';
  const D = rec.detail || {}; const st = k => ((D[k] || {}).stats || []).filter(x => x.note && x.j !== 'M');
  const notes = ['A2', 'A3', 'A4', 'B1'].flatMap(st), atk = st('A3');
  const top = RA.weak[0];
  view.innerHTML = `<div class="stage"><div class="arena report"><canvas class="fx"></canvas>
    <div class="rhead">今日の採点 <span>${today()}</span></div>
    <div class="total"><span id="tot">00.000</span><small>点</small></div>
    <div class="diff" id="diff"></div><div class="hint" style="grid-column:1/-1;justify-self:center">↑ 定点メニューの点（毎日同じ課題・推移に使う）｜日替わり込みの点 ${RA.total.toFixed(1)}　※傾向と「明日まずこれだけ」は全メニューから</div>
    <div class="tend"><div class="lab">全体の傾向</div><div class="head">${headline}</div>${strong ? `<div class="strong">${strong}</div>` : ''}${T.length ? tchipsHTML(T) : ''}</div>
    <div class="nextcard big ${top ? '' : 'l0'}" style="animation: slidein .5s ease-out 2.7s both"><div class="lab">明日の15分で、まずこれだけ</div><div class="nt">${top ? top.title : '目立つ苦手なし！'}</div><div class="na">${top ? top.tip : '全ステージやるとデータが揃って精度が上がります'}</div></div>
    <div class="rgrid"><div class="rcol">${radarSVG(R.sc, prevRec && prevRec.sc)}<div class="legend"><i class="l1"></i>今日 ${prevRec ? '<i class="l2"></i>前回' : ''}</div></div>
      <div class="rcol"><div class="wt">苦手 TOP3</div>${RA.weak.length ? RA.weak.map((w, i) => `<div class="weak" style="animation-delay:${2.9 + i * .4}s"><b>${i + 1}</b><div><div class="wtitle">${w.title}</div><div class="wtip">${w.tip}</div></div></div>`).join('') : '<div class="weak" style="animation-delay:2.9s"><b>—</b><div><div class="wtitle">目立つ苦手なし！</div><div class="wtip">データが少ないステージがあれば、全部やると精度が上がります</div></div></div>'}
      ${R.best ? `<div class="bestline" style="animation-delay:${2.9 + RA.weak.length * .4}s">今日いちばん良かった：<b>${R.best.name}</b>（${Math.round(R.sc[R.best.k])}点）</div>` : ''}
      <div class="wt" style="margin-top:10px">14日間の総合点</div>${trendSVG()}</div></div>
    <div class="vgrid"><div class="vbox"><div class="wt">音ごとの上ずり・沈み</div>${noteMapSVG(notes)}</div><div class="vbox"><div class="wt">アタックのタイミング</div>${timingSVG(atk.map(x => x.on).filter(okv), atk.map(x => x.lock).filter(okv))}</div></div>
    <div class="vbox" style="width:100%"><div class="wt">ここ14日の変化と癖</div><div class="hlist">${historyTrend(R)}</div></div>
    <div class="row" style="justify-content:center"><button class="btn big" id="hm">🏠 ホームへ</button></div>
  </div><div id="buddy" class="buddy">${buddySVG()}<div class="bubble">ドゥルルルル……</div></div></div>`;
  fxCanvas = view.querySelector('canvas.fx'); $('#hm').onclick = home;
  const t0 = performance.now(), DUR = 2200, el = $('#tot'); let lastTick = 0;
  const roll = () => { const t = performance.now() - t0;
    if (t - lastTick > 55) { lastTick = t; const c = ac().currentTime; tone(160 + Math.random() * 40, c, .05, 'square', .05); }
    if (t < DUR) { el.textContent = (Math.random() * 99.999).toFixed(3).padStart(6, '0'); raf = requestAnimationFrame(roll); return; }
    el.textContent = R.total.toFixed(3); el.parentNode.classList.add('reveal'); SFX.fanfare();
    for (let k = 0; k < 8; k++) later(() => burst(Math.random() * fxCanvas.clientWidth, fxCanvas.clientHeight * .25, ['#ffd54a', '#35d6c8', '#ffb020', '#4ade80', '#ff6b9a'][k % 5], 60, 1.3), k * 110);
    if (diff !== null) $('#diff').innerHTML = `<span class="${diff >= 0 ? 'up' : 'down'}">前回比 ${diff >= 0 ? '▲ +' : '▼ '}${diff.toFixed(3)}</span>`;
    buddy(R.total >= 80 ? 'fire' : R.total >= 60 ? 'happy' : 'calm', comment, true);
  };
  raf = requestAnimationFrame(roll);
}

// ---------- finish ----------
function finish(win) {
  const s = STAGES[stageIdx]; stopStage(); const rec = dayRec();
  const total = judges.P + judges.G + judges.O + judges.M; const acc = total ? (judges.P + judges.G * .7 + judges.O * .4) / total : 0;
  const rank = win || acc >= .9 ? 'S' : acc >= .75 ? 'A' : acc >= .55 ? 'B' : acc >= .3 ? 'C' : 'D';
  const first = !rec.stages[s.id]; const bonus = Math.round(s.xp * (0.5 + acc * 0.5)) + (win ? 100 : 0); const before = level(S.xp);
  const prev = rec.stages[s.id]; if (!prev || score > prev.score) rec.stages[s.id] = { score, rank, judges, maxCombo, win: !!win };
  rec.detail = rec.detail || {}; rec.detail[s.id] = { stats: stats.slice(-300), judges };
  if (first) { S.xp += bonus; rec.xp += bonus; } save(); renderTop(); const lvUp = level(S.xp) > before;
  SFX.fanfare(); if (lvUp) later(SFX.levelup, 1400);
  const by = {}; stats.filter(x => x.note && x.j !== 'M').forEach(x => (by[x.note] = by[x.note] || []).push(x.cents));
  const noteRows = Object.keys(by).sort((a, b) => b - a).map(m => { const a = by[m], av = a.reduce((x, y) => x + y, 0) / a.length; return `<tr><td>${midiName(+m)} 平均</td><td class="${Math.abs(av) <= 10 ? 'okc' : 'ngc'}">${av > 0 ? '+' : ''}${av.toFixed(0)} セント</td></tr>`; }).join('');
  const allDone = STAGES.every(x => rec.stages[x.id]);
  const msg = win ? 'ボス撃破！！' : rank === 'S' ? '師匠も唸るレベル！' : rank === 'A' ? 'いい感じ！この調子' : rank === 'B' ? 'まずまず！明日はA狙い' : 'やったことがえらい！';
  view.innerHTML = `<div class="stage"><div class="arena result-arena"><canvas class="fx"></canvas><div class="result">
    <div class="stamp r${rank}">${rank}</div><div class="score">${score.toLocaleString()}</div>
    ${lvUp ? `<div class="levelup">LEVEL UP!  Lv ${level(S.xp)}</div>` : ''}
    <div class="xpgain">${first ? '+' + bonus + ' XP' : 'ベスト更新チャレンジ（XPは1日1回）'}</div>
    ${stageNext(s)}<table><tr><td>ど真ん中 PERFECT</td><td>${judges.P}</td></tr><tr><td>いいね GREAT</td><td>${judges.G}</td></tr><tr><td>おしい OK</td><td>${judges.O}</td></tr><tr><td>ミス MISS</td><td>${judges.M}</td></tr><tr><td>最大コンボ</td><td>${maxCombo}</td></tr>${noteRows}</table>
    <div class="row" style="justify-content:center"><button class="btn big" id="next">${allDone ? '🎤 今日の採点を見る' : '▶ 次のステージへ'}</button><button class="btn ghost" id="again">もう一回</button></div>
  </div></div><div id="buddy" class="buddy jump">${buddySVG()}<div class="bubble">${msg}</div></div></div>`;
  fxCanvas = view.querySelector('canvas.fx'); buddy(rank === 'S' || win ? 'fire' : rank === 'D' ? 'calm' : 'happy', msg, true);
  later(() => { for (let k = 0; k < 7; k++) later(() => burst(Math.random() * fxCanvas.clientWidth, fxCanvas.clientHeight * .3, ['#ffd54a', '#35d6c8', '#ffb020', '#4ade80'][k % 4], 50), k * 150); }, 200);
  $('#again').onclick = () => runStage(stageIdx);
  $('#next').onclick = () => { if (allDone) report(); else { const nx = STAGES.findIndex(x => !rec.stages[x.id]); nx < 0 ? home() : runStage(nx); } };
}

home();
})();

</script>
